  <text class="muted xs" x="20" y="852">Wireframe de baja fidelidad. Representa intención de producto, no estado del repositorio. Densidad y tipografía definitivas quedan sujetas al sistema de diseño compartido (sistema-diseno-compartido.md).</text>
