<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill:#f6f6f7; }
      .frame { fill:#ffffff; stroke:#c9c9cf; stroke-width:1.5; }
