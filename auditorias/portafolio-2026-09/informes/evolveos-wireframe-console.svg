  <text class="muted xs mono" x="372" y="722">#1840 dr_validated   —      curator   ki-2026-088   9b71…a02 ✔</text>
  <text class="muted xs mono" x="372" y="742">#1839 agent_invoked  DEEP-RES operator —              c3d0…77e ✔</text>
  <text class="muted xs mono" x="372" y="762">#1838 venture_stage  3→4    operator  V-2026-1      a1f9…4b8 ✔</text>
  <text class="muted xs" x="372" y="786">Cadena verificada hasta la cabeza · verify-log sin discrepancias</text>
  <rect class="box" x="372" y="796" width="140" height="0" rx="4"/>

