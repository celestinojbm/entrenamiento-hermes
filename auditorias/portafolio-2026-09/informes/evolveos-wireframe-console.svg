      .s { font-size:12.5px; }
      .xs { font-size:11px; }
      .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
      .note { fill:#fff8e6; stroke:#e0c27a; stroke-width:1.2; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="860"/>

  <!-- Barra superior -->
